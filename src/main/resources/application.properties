# Configuração do Servidor
# ==============================================================================
quarkus.http.root-path=${QUARKUS_HTTP_ROOT_PATH:/api}

# ==============================================================================
# Azure Functions
# ==============================================================================
quarkus.azure-functions.app-name=functions-tc-postech
quarkus.azure-functions.region=brazilsouth
quarkus.azure-functions.resource-group=rg-fiap-postech
quarkus.azure-functions.function-name=avaliacao-feedback
quarkus.azure-functions.runtime.java-version=21
quarkus.azure-functions.deploy=true

# ==============================================================================
# Configuração do Banco de Dados PostgreSQL
# ==============================================================================
quarkus.datasource.db-kind=${QUARKUS_DATASOURCE_DB_KIND:postgresql}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:feedback}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:feedback}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/feedback}

# ==============================================================================
# Hibernate
# ==============================================================================
quarkus.hibernate-orm.database.generation=${QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION:update}
quarkus.hibernate-orm.log.sql=${QUARKUS_HIBERNATE_ORM_LOG_SQL:false}

# =========================
# MAILER
# =========================
quarkus.mailer.host=${EMAIL_HOST:localhost}
quarkus.mailer.port=${EMAIL_PORT:1025}
quarkus.mailer.username=${EMAIL_USER:}
quarkus.mailer.password=${EMAIL_PASS:}
quarkus.mailer.from=${EMAIL_FROM:noreply@feedback-system.com}
notification.admin.email=${NOTIFICATION_ADMIN_EMAIL:admin@feedback-system.com}
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.auth=false
quarkus.mailer.mock=${QUARKUS_MAILER_MOCK:false}


# =========================
# FILA
# =========================
azure.storage.queue.name=${QUEUE_NAME:feedback-queue}
azure.storage.queue.connection-string=${QUEUE_CONNECTION_STRING:}

#Configuração do agendamento de geração de relatórios
azure.report.generation.schedule=${REPORT_GENERATION_SCHEDULE:0 0 0 ? * MON}

# ==============================================================================
# Monitoramento & Observabilidade
# ==============================================================================

# Micrometer Metrics
quarkus.micrometer.enabled=true
quarkus.micrometer.registry-enabled-by-default=false
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.http-client.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.processor=true

# Health checks
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness.root-path=/q/health/live
quarkus.smallrye-health.readiness.root-path=/q/health/ready

# ==============================================================================
# Logging
# ==============================================================================
quarkus.log.level=INFO
quarkus.log.category."com.feedback".level=DEBUG
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."org.postgresql".level=WARN
quarkus.log.file.enabled=true
quarkus.log.file.path=logs/feedback-system.log
quarkus.log.file.max-file-size=10M
quarkus.log.file.max-backup-index=5
# =========================
# TEST PROFILE
# =========================
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb
%test.quarkus.mailer.mock=true
%test.quarkus.mailer.enabled=false

# =========================
# PACKAGE
# =========================
quarkus.package.type=fast-jar


