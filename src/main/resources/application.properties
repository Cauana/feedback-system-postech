# Configura��es do Banco de Dados
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:feedback_user}
quarkus.datasource.password=${DB_PASSWORD:feedback_password}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/feedback_db}
quarkus.http.port=${PORT:8080}

# Hibernate
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# Azure Functions
quarkus.azure-functions.http.enable=true
