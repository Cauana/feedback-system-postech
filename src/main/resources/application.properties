# ==============================================================================
# Configuração do Servidor
# ==============================================================================
quarkus.http.root-path=${QUARKUS_HTTP_ROOT_PATH:/api}

# ==============================================================================
# Azure Functions
# ==============================================================================
quarkus.azure-functions.app-name=function-quarkus-postech

# ==============================================================================
# Configuração do Banco de Dados PostgreSQL
# ==============================================================================
quarkus.datasource.db-kind=${QUARKUS_DATASOURCE_DB_KIND:postgresql}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:postgres}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/feedback_db}

# ==============================================================================
# Hibernate
# ==============================================================================
quarkus.hibernate-orm.database.generation=${QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION:update}
quarkus.hibernate-orm.log.sql=${QUARKUS_HIBERNATE_ORM_LOG_SQL:true}

# ==============================================================================
# Configuração de E-mail (SMTP)
# ==============================================================================
quarkus.mailer.from=${QUARKUS_MAILER_FROM:noreply@feedback-system.com}
quarkus.mailer.host=${QUARKUS_MAILER_HOST:smtp.gmail.com}
quarkus.mailer.port=${QUARKUS_MAILER_PORT:587}
quarkus.mailer.start-tls=${QUARKUS_MAILER_START_TLS:REQUIRED}
quarkus.mailer.username=${SMTP_USERNAME:seu-email@gmail.com}
quarkus.mailer.password=${SMTP_PASSWORD:sua-senha-app}

# E-mail do administrador para notificações de urgência
feedback.admin.email=${ADMIN_EMAIL:admin@example.com}

# Mock para desenvolvimento (true = não envia e-mail real)
quarkus.mailer.mock=${QUARKUS_MAILER_MOCK:true}