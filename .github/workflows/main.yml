name: Deploy Quarkus to Azure

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 'Login via Azure CLI'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Build and Deploy'
        # Passamos propriedades fictícias do datasource apenas para satisfazer o Quarkus no build.
        # Na Azure, as "Application Settings" reais sobrescreverão esses valores.
        run: |
          mvn clean package quarkus:deploy \
            -Dquarkus.datasource.db-kind=postgresql \
            -Dquarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/build_db \
            -Dquarkus.datasource.username=build_user \
            -Dquarkus.datasource.password=build_pass \
            -Dquarkus.hibernate-orm.database.generation=none \
            -DskipTests
